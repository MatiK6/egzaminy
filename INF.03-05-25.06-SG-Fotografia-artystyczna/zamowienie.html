<body>

  <img src="2.jpg" alt="obrazy do sprzedaży" title="2.jpg">

<main>
  <section id="lewa">
    <h3>Zamówienie</h3>
    <label for="wyborPliku">Wybierz obraz:</label>
    <input type="file" name="wyborPliku" id="wyborPliku" accept="image/JPEG"><br>
    <label for="liczbaKopii">liczbaKopii:</label>
    <input type="number" name="liczbaKopii" id="liczbaKopii"><br>
    <input type="radio" name="radioWybur" id="papierBlyszczacy" checked>Papier Błyszczący</input><br>
    <input type="radio" name="radioWybur" id="papierMatowy">Papier Matowy</input><br>
    <button onclick="cenaDruku()">Dodaj do koszyka</button>
  </section>
  <nav>

      <li><a href="uslugi.html">Usługi</a></li>
      <li><a href="https://pixabay.com">Zdjęcia</a></li>
    </ul>
  </nav>
  <section id="prawa">
    <h3>Koszyk</h3>
    <div id="koszyk"></div>
  </section>
</main>

<footer>
  <p>Autor strony: <i>235878907235</i></p>
</footer>

</html>
<script>
  function cenaDruku(){
    const koszyk = document.getElementById('koszyk')
    let = nazwaPliku = document.getElementById('wyborPliku').files[0]
    let = liczbaKopii = document.getElementById('liczbaKopii').value
    let = papierBlyszczacy = document.getElementById('papierBlyszczacy').checked
    let = papierMatowy = document.getElementById('papierMatowy').checked

    // console.log(nazwaPliku, liczbaKopii, papierBlyszczacy, papierMatowy)

    let cenaBlyszczacego = 1.5
    let cenaMatowego = 2

    let cenaOstateczna
    if(papierBlyszczacy == true){
      cenaOstateczna = liczbaKopii * cenaBlyszczacego
    }
    if(papierMatowy == true){
      cenaOstateczna = liczbaKopii * cenaMatowego
    }
    // console.log(cenaOstateczna)
    let elementZdjecie = document.createElement("img")
    let elementLiczbaKopii = document.createElement("p")
    let elementCena = document.createElement("p")

    elementZdjecie.src = nazwaPliku.name
    elementLiczbaKopii.innerText = `Liczba kopii: ${liczbaKopii}`
    elementCena.innerText = `Cena: ${cenaOstateczna}`

    koszyk.appendChild(elementZdjecie)
    koszyk.appendChild(elementLiczbaKopii)
    koszyk.appendChild(elementCena)



  }


</script>
